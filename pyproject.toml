[project]
name = "deepparse-artifact"
version = "1.0.0"
description = "Hybrid LLM-assisted log parsing artifact"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Anonymous"}]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]
lint = [
    "ruff>=0.1",
]
# Inference-only LLM stack (required when synth_masks(mode="hf") is used).
hf = [
    "torch>=2.1",
    "transformers>=4.36",
    "accelerate>=0.24",
    "peft>=0.7",
]
# Adds the fine-tuning toolchain on top of `hf` extras.
train = [
    "torch>=2.1",
    "transformers>=4.36",
    "accelerate>=0.24",
    "peft>=0.7",
    "datasets>=2.14",
    "trl>=0.7",
]

[project.scripts]
deepparse = "deepparse.cli:cli"

[tool.setuptools.packages.find]
include = ["deepparse*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
