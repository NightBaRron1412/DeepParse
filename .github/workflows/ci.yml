name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint]"
      - run: ruff check deepparse tests

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint,test]"
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,lint]"
      - run: pytest -q --cov --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration:
    name: Integration (real LogHub-2k)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Fetch LogHub-2k Apache + HDFS
        run: python -m deepparse.tools.fetch_loghub --systems Apache HDFS
      - name: Run integration tests
        run: pytest -q -m integration

  demo:
    name: Demo pipeline
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,lint]"
      - name: Run bundled demo
        run: |
          ./scripts/prepare_paths.sh
          deepparse synth --dataset DemoTiny --mode offline \
                           --out artifacts/masks/DemoTiny.json
          deepparse eval  --config configs/demo_small.yaml --deterministic
          deepparse table --inputs artifacts/outputs/demo_metrics.csv \
                           --out artifacts/outputs/tables/
      - name: Verify perfect demo metrics
        run: |
          python - <<'PY'
          import csv, sys
          rows = list(csv.DictReader(open("artifacts/outputs/demo_metrics.csv")))
          for row in rows:
              assert float(row["GA"]) == 1.0, row
              assert float(row["PA"]) == 1.0, row
          print("OK", rows)
          PY
